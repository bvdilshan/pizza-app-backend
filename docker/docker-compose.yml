version: '3.8'
services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "5000:5000"
    env_file:
      - ../backend/.env
    environment:
      - MONGO_URI=mongodb://host.docker.internal:27017/crustoria
    volumes:
      - ../backend:/app
      - /app/node_modules